# Especificação opcional do App Platform (App Spec) do Banco de Questões.
#
# Este projeto é um molde: cada cursinho/instituição que o usar roda na
# PRÓPRIA conta do DigitalOcean (app, banco e Space próprios). Por isso
# todos os valores abaixo são placeholders (SEU_/TROQUE_) — nada aqui
# aponta para a infraestrutura de quem criou o projeto.
#
# Não é obrigatório: dá para criar o app direto pelo painel. Para usar
# este arquivo: faça um fork do projeto, troque os placeholders pelos
# SEUS valores e use painel > Create > Apps > Edit Your App Spec, ou
# `doctl apps create --spec .do/app.yaml`.
#
# Nunca commite chaves reais neste arquivo (ele vai pro Git): deixe os
# segredos (chave do Django, credenciais do Spaces) em branco aqui e
# preencha-os no painel do App Platform, marcados como "Encrypt".
#
# Depois de cada deploy que mude modelos, rode no Console do app:
#   python manage.py migrate
name: cursinho-questoes
region: nyc
services:
  - name: web
    github:
      repo: SEU_USUARIO/SEU_REPOSITORIO   # o SEU fork deste projeto no GitHub
      branch: main
      deploy_on_push: true
    environment_slug: python
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 8080
    build_command: pip install -r requirements.txt && python manage.py collectstatic --noinput
    run_command: gunicorn config.wsgi:application --bind 0.0.0.0:8080
    routes:
      - path: /
    envs:
      - key: DJANGO_SECRET_KEY
        type: SECRET
        value: "TROQUE_POR_UMA_CHAVE_ALEATORIA"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "${APP_DOMAIN}"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://${APP_DOMAIN}"
      - key: DATABASE_URL
        value: "${db.DATABASE_URL}"
      - key: SPACES_ACCESS_KEY_ID
        type: SECRET
        value: ""
      - key: SPACES_SECRET_ACCESS_KEY
        type: SECRET
        value: ""
      - key: SPACES_BUCKET_NAME
        value: ""
      - key: SPACES_REGION
        value: "nyc3"
      # Opcionais: CDN do Space e validade (em segundos) das URLs assinadas.
      # - key: SPACES_CDN_DOMAIN
      #   value: ""
      # - key: SPACES_URL_EXPIRE_SECONDS
      #   value: "3600"

databases:
  - name: db
    engine: PG
    production: true
    # Nome do cluster PostgreSQL gerenciado que já existe na sua conta.
    cluster_name: SEU_CLUSTER_JA_CRIADO
